spring:
  application:
    name: moddex-backend

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

# Moddex configuration (can be overridden by env or system properties)
moddex:
  root: ${MODDEX_ROOT:/var/lib/moddex}
  process:
    shutdown-timeout-ms: ${MODDEX_PROCESS_SHUTDOWN_TIMEOUT_MS:60000}
  backup:
    # How long a backup of a running instance waits for the server to confirm
    # save-off and save-all flush through the console before aborting safely.
    world-save-confirmation-timeout-ms: ${MODDEX_BACKUP_WORLD_SAVE_CONFIRMATION_TIMEOUT_MS:60000}
  installer:
    # How long a loader installer process may run before the backend terminates
    # it. Installers download and extract their artifacts, so the budget must
    # exceed a slow-but-working install.
    timeout-ms: ${MODDEX_INSTALLER_TIMEOUT_MS:900000}
    # Grace period between the orderly termination of a stalled installer and
    # its forced termination.
    destroy-grace-ms: ${MODDEX_INSTALLER_DESTROY_GRACE_MS:10000}
  artifacts:
    max-download-size-bytes: ${MODDEX_ARTIFACT_MAX_DOWNLOAD_SIZE_BYTES:1073741824}
  logs:
    dir: ${MODDEX_LOG_DIR:}
  paths:
    config: ${MODDEX_CONFIG_DIR:/etc/moddex}
    data: ${MODDEX_DATA_DIR:${moddex.root}}
    logs: ${MODDEX_LOG_DIR:}
